[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noted"
version = "0.2.0"
description = "A fast, keyboard-first Terminal Note-Taking & Journaling CLI & TUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=8.2.8",
    "pyyaml>=6.0.1",
    "tomli>=2.0; python_version < '3.11'",
    "cryptography>=42.0.0",
]

[project.scripts]
note = "noted.cli:app"
noted = "noted.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/noted"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
