name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: noted-windows-x64.zip
            binary_src: dist/noted.exe
            archive_cmd: 7z a noted-windows-x64.zip ./dist/noted.exe README.md LICENSE
          - os: ubuntu-latest
            artifact_name: noted-linux-x64.tar.gz
            binary_src: dist/noted
            archive_cmd: tar -czvf noted-linux-x64.tar.gz -C dist noted
          - os: macos-latest
            artifact_name: noted-macos-arm64.tar.gz
            binary_src: dist/noted
            archive_cmd: tar -czvf noted-macos-arm64.tar.gz -C dist noted
          - os: macos-13
            artifact_name: noted-macos-x64.tar.gz
            binary_src: dist/noted
            archive_cmd: tar -czvf noted-macos-x64.tar.gz -C dist noted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies & pyinstaller
        run: uv sync --all-extras --dev

      - name: Build standalone executable
        run: uv run pyinstaller noted.spec --clean

      - name: Package binary archive
        shell: bash
        run: ${{ matrix.archive_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
