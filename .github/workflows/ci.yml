name: CI

on:
  push:
    branches: [ "main", "feat/library-resource-ui" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Run test suite
        run: uv run --python ${{ matrix.python-version }} pytest -v

      - name: Build Windows executable
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.11'
        run: uv run --python 3.11 pyinstaller noted.spec --clean --noconfirm

      - name: Smoke test Windows executable
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.11'
        run: ./dist/noted.exe --help

      - name: Upload Windows executable
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: noted-windows-x64
          path: dist/noted.exe
